name: Offline v2 identity audit and salvage

on:
  push:
    branches: [main]
    paths:
      - "identity_guard.py"
      - "salvage_runner.py"
      - "corpus_runner.py"
      - ".github/workflows/salvage_v2.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Planet harvest run ID to audit/salvage"
        required: true
        default: "33978226912"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identity guard self-test
        run: python identity_guard.py
      - name: Salvage runner self-test
        run: python salvage_runner.py self-test
      - name: Existing planet self-test
        run: python planet_runner.py self-test

  salvage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source run id
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "source_run_id must be numeric" >&2; exit 2; }

      - name: Download completed planet artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "phone-defaults-planet-$SOURCE_RUN_ID" \
            --dir work/source

      - name: Run offline identity audit and safe byte-reuse salvage
        run: >-
          python salvage_runner.py salvage
          --source work/source
          --out out/salvage

      - name: Summary
        shell: bash
        run: |
          cat out/salvage/summary.md
          cat out/salvage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload v2 salvage metadata
        uses: actions/upload-artifact@v4
        with:
          name: planet-v2-salvage-${{ inputs.source_run_id }}
          path: out/salvage/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
