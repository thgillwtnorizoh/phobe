name: Catalog André phone archive

on:
  push:
    branches: [main]
    paths:
      - "archive_catalog.py"
      - "archive_runner.py"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl every brand and model folder
        run: python archive_catalog.py out/archive-catalog

      - name: Show summary
        if: always()
        run: |
          if [[ -f out/archive-catalog/summary.md ]]; then
            cat out/archive-catalog/summary.md
            cat out/archive-catalog/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload archive catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andre-phone-model-catalog-${{ github.run_number }}
          path: out/archive-catalog/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
