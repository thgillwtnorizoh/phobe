name: Catalog André phone archive

on:
  push:
    branches: [main]
    paths:
      - "archive_catalog.py"
      - "archive_runner.py"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl every brand and model folder + rebuild model dropdown
        run: >-
          python archive_catalog.py out/archive-catalog
          --sync-workflow .github/workflows/harvest.yml

      - name: Show summary
        if: always()
        run: |
          if [[ -f out/archive-catalog/summary.md ]]; then
            cat out/archive-catalog/summary.md
            cat out/archive-catalog/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish generated workflow as raw Git blob
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path

          workflow = Path('.github/workflows/harvest.yml')
          data = workflow.read_bytes()
          payload = json.dumps({
              'content': base64.b64encode(data).decode('ascii'),
              'encoding': 'base64',
          }).encode('utf-8')
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/git/blobs"
          request = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'phobe-model-catalog',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          sha = result['sha']
          print(f"GENERATED_WORKFLOW_BLOB_SHA={sha}")
          out = Path('out/archive-catalog')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'harvest_workflow_blob_sha.txt').write_text(sha + '\n', encoding='utf-8')
          (out / 'harvest.generated.yml').write_bytes(data)
          PY

      - name: Upload archive catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andre-phone-model-catalog-${{ github.run_number }}
          path: out/archive-catalog/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
