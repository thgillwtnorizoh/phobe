name: Harvest phone defaults

on:
  push:
    branches: [main]
    paths:
      - "phone_defaults.py"
      - "archive_runner.py"
      - "model_runner.py"
      - "corpus_runner.py"
      - ".github/workflows/harvest.yml"
  workflow_dispatch:
    inputs:
      brand:
        description: "Phone brand / archive folder"
        required: true
        default: "Samsung"
        type: choice
        options:
          - Samsung
          - Google
          - Xiaomi
          - OnePlus
          - Motorola
          - Huawei
          - Honor
          - Oppo
          - Vivo
          - Sony
          - LG
          - HTC
          - Nokia
          - Asus
          - Apple
          - Realme
          - Nothing
          - ZTE
          - Meizu
          - Custom
      custom_brand:
        description: "Only used when Brand = Custom. Must match André's archive folder name."
        required: false
        default: ""
        type: string
      scope:
        description: "What should this run harvest?"
        required: true
        default: "One model"
        type: choice
        options:
          - One model
          - Matching models
          - First N models
          - Whole brand
      model_preset:
        description: "Archive model name (4655 unique names; typed filter below overrides)"
        required: true
        default: "Galaxy-S9"
        type: choice
