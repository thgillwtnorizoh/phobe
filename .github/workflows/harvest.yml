name: Harvest phone defaults

on:
  push:
    branches: [main]
    paths:
      - "phone_defaults.py"
      - "archive_runner.py"
      - "model_runner.py"
      - "corpus_runner.py"
      - ".github/workflows/harvest.yml"
  workflow_dispatch:
    inputs:
      brand:
        description: "Phone brand / archive folder"
        required: true
        default: "Samsung"
        type: choice
        options:
          - Samsung
          - Google
          - Xiaomi
          - OnePlus
          - Motorola
          - Huawei
          - Honor
          - Oppo
          - Vivo
          - Sony
          - LG
          - HTC
          - Nokia
          - Asus
          - Apple
          - Realme
          - Nothing
          - ZTE
          - Meizu
          - Custom
      custom_brand:
        description: "Only used when Brand = Custom. Must match André's archive folder name."
        required: false
        default: ""
        type: string
      scope:
        description: "What should this run harvest?"
        required: true
        default: "One model"
        type: choice
        options:
          - One model
          - Matching models
          - First N models
          - Whole brand
      model_preset:
        description: "Quick model/family filter. Ignored when Typed model/filter below is not blank."
        required: true
        default: "Galaxy S9"
        type: choice
        options:
          - "Galaxy S9"
          - "Galaxy Note 7"
          - "Galaxy Note 8"
          - "Galaxy Note 9"
          - "Galaxy S8"
          - "Galaxy S10"
          - "Galaxy S20"
          - "Galaxy S21"
          - "Galaxy S22"
          - "Galaxy S23"
          - "Galaxy S24"
          - "Galaxy S25"
          - "Galaxy Note"
          - "Galaxy S"
          - "Galaxy A"
          - "Galaxy Z"
          - "Pixel 6"
          - "Pixel 7"
          - "Pixel 8"
          - "Pixel 9"
          - "Pixel"
          - "Redmi Note"
          - "Redmi"
          - "Mi"
          - "OnePlus"
          - "Xperia"
          - "Moto G"
          - "Moto"
          - "iPhone"
          - "LG G"
          - "HTC One"
          - "Nokia"
      model:
        description: "Typed model/filter (optional). If nonblank, this OVERRIDES Model preset."
        required: false
        default: ""
        type: string
      limit_models:
        description: "Maximum models for Matching / First N. 0 means every match."
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
          - "25"
          - "50"
          - "0"
      max_repos:
        description: "Maximum ordinary firmware repos inspected per model"
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "4"
          - "8"
          - "12"
      download_audio:
        description: "Download matched default ringtone / notification / alarm files"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: phone-default-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline parser and selector test
        run: python corpus_runner.py self-test

  live-smoke:
    if: github.event_name == 'push'
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl live Galaxy S9
        run: >-
          python corpus_runner.py harvest
          --brand Samsung
          --model Galaxy-S9
          --limit-models 1
          --max-repos 4
          --out-dir out/smoke
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-defaults-smoke-${{ github.run_number }}
          path: out/smoke/
          if-no-files-found: warn
          retention-days: 7

  harvest:
    if: github.event_name == 'workflow_dispatch'
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve friendly controls
        id: controls
        shell: bash
        run: |
          set -euo pipefail

          BRAND="${{ inputs.brand }}"
          if [[ "$BRAND" == "Custom" ]]; then
            BRAND="${{ inputs.custom_brand }}"
            if [[ -z "$BRAND" ]]; then
              echo "Brand is Custom but custom_brand is blank." >&2
              exit 2
            fi
          fi

          SCOPE="${{ inputs.scope }}"
          PRESET_MODEL="${{ inputs.model_preset }}"
          TYPED_MODEL="${{ inputs.model }}"
          LIMIT="${{ inputs.limit_models }}"

          if [[ -n "$TYPED_MODEL" ]]; then
            MODEL="$TYPED_MODEL"
            MODEL_SOURCE="typed"
          else
            MODEL="$PRESET_MODEL"
            MODEL_SOURCE="preset"
          fi

          case "$SCOPE" in
            "One model")
              if [[ -z "$MODEL" ]]; then
                echo "One model requires a model filter." >&2
                exit 2
              fi
              LIMIT=1
              ;;
            "Matching models")
              if [[ -z "$MODEL" ]]; then
                echo "Matching models requires a model filter." >&2
                exit 2
              fi
              ;;
            "First N models")
              MODEL=""
              MODEL_SOURCE="scope"
              if [[ "$LIMIT" == "0" ]]; then
                echo "First N with limit 0 is the same as Whole brand; continuing." >&2
              fi
              ;;
            "Whole brand")
              MODEL=""
              MODEL_SOURCE="scope"
              LIMIT=0
              ;;
          esac

          echo "brand=$BRAND" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"

          echo "HARVEST_BRAND=$BRAND" >> "$GITHUB_ENV"
          echo "HARVEST_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "HARVEST_MODEL_SOURCE=$MODEL_SOURCE" >> "$GITHUB_ENV"
          echo "HARVEST_LIMIT=$LIMIT" >> "$GITHUB_ENV"

          echo "### Resolved controls" >> "$GITHUB_STEP_SUMMARY"
          echo "- Brand: \`$BRAND\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: \`$SCOPE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preset model: \`$PRESET_MODEL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Typed model: \`${TYPED_MODEL:-<blank>}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Effective model filter: \`${MODEL:-<none>}\` ($MODEL_SOURCE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model limit: \`$LIMIT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Harvest selected phone(s)
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            harvest
            --brand "${{ steps.controls.outputs.brand }}"
            --model "${{ steps.controls.outputs.model }}"
            --limit-models "${{ steps.controls.outputs.limit }}"
            --max-repos "${{ inputs.max_repos }}"
            --out-dir "out/harvest"
          )
          if [[ "${{ inputs.download_audio }}" == "true" ]]; then
            ARGS+=(--download)
          fi
          python corpus_runner.py "${ARGS[@]}"

      - name: Human-readable summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import os

          root = Path("out/harvest")
          rows = []
          p = root / "results.csv"
          if p.exists():
              with p.open(encoding="utf-8-sig", newline="") as f:
                  rows = list(csv.DictReader(f))

          confirmed = sum(r.get("confidence") == "CONFIRMED" for r in rows)
          partial = sum(r.get("confidence") == "PARTIAL" for r in rows)
          unresolved = len(rows) - confirmed - partial
          brand = os.environ.get("HARVEST_BRAND", "?")
          model = os.environ.get("HARVEST_MODEL", "") or "<none>"
          model_source = os.environ.get("HARVEST_MODEL_SOURCE", "?")

          summary = (
              f"## Phone Default Harvester\n\n"
              f"- Brand: `{brand}`\n"
              f"- Model filter: `{model}` ({model_source})\n"
              f"- Models processed: **{len(rows)}**\n"
              f"- Confirmed: **{confirmed}**\n"
              f"- Partial: **{partial}**\n"
              f"- Other / unresolved: **{unresolved}**\n"
          )
          Path("summary.md").write_text(summary, encoding="utf-8")
          print(summary)
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload harvest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-defaults-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
